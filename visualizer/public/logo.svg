<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="100" height="100" rx="20" fill="url(#bgGrad)"/>

  <!-- Tensor brackets -->
  <path d="M 15 18 L 15 82 L 26 82 L 26 77 L 20 77 L 20 23 L 26 23 L 26 18 Z" fill="url(#tensorGrad)"/>
  <path d="M 85 18 L 85 82 L 74 82 L 74 77 L 80 77 L 80 23 L 74 23 L 74 18 Z" fill="url(#tensorGrad)"/>

  <!-- Flow lines -->
  <line x1="30" y1="37" x2="70" y2="37" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="30" y1="63" x2="70" y2="63" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Data nodes (diagonal flow pattern) -->
  <circle cx="36" cy="37" r="4.5" fill="url(#dotGrad)"/>
  <circle cx="50" cy="50" r="4.5" fill="url(#dotGrad)"/>
  <circle cx="64" cy="63" r="4.5" fill="url(#dotGrad)"/>

  <!-- Convergence point -->
  <path d="M 70 37 L 82 50 L 70 63" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="82" cy="50" r="5" fill="#06b6d4"/>
  <circle cx="82" cy="50" r="9" fill="none" stroke="#06b6d4" opacity="0.3" stroke-width="1.5"/>
</svg>

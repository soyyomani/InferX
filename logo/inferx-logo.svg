<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="tensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark: Stylized tensor/neural flow icon -->
  <g transform="translate(20, 15)">
    <!-- Outer tensor bracket left -->
    <path d="M 5 10 L 5 80 L 15 80 L 15 75 L 10 75 L 10 15 L 15 15 L 15 10 Z" fill="url(#tensorGrad)" opacity="0.9"/>
    <!-- Outer tensor bracket right -->
    <path d="M 75 10 L 75 80 L 65 80 L 65 75 L 70 75 L 70 15 L 65 15 L 65 10 Z" fill="url(#tensorGrad)" opacity="0.9"/>
    
    <!-- Neural flow lines (3 parallel paths representing data flow) -->
    <line x1="20" y1="30" x2="60" y2="30" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="45" x2="60" y2="45" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="60" x2="60" y2="60" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Data nodes on flow lines -->
    <circle cx="25" cy="30" r="3.5" fill="url(#dotGrad)"/>
    <circle cx="40" cy="45" r="3.5" fill="url(#dotGrad)"/>
    <circle cx="55" cy="60" r="3.5" fill="url(#dotGrad)"/>
    
    <!-- Converging arrow (inference output) -->
    <path d="M 62 30 L 72 45 L 62 60" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="45" r="4" fill="#06b6d4"/>
  </g>

  <!-- Text: InferX -->
  <g transform="translate(110, 0)">
    <!-- "Infer" in bold weight -->
    <text x="0" y="75" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" letter-spacing="-1">
      Infer
    </text>
    <!-- "X" with gradient accent -->
    <text x="148" y="75" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#tensorGrad)" letter-spacing="-1">
      X
    </text>
  </g>

  <!-- Tagline -->
  <text x="112" y="98" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="12" font-weight="400" fill="#94a3b8" letter-spacing="3">
    AI INFERENCE ENGINE
  </text>

  <!-- Subtle speed line accent under text -->
  <rect x="112" y="104" width="80" height="1.5" rx="1" fill="url(#accentGrad)" opacity="0.6"/>
</svg>

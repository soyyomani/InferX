<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="440" height="160">
  <defs>
    <linearGradient id="tensorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="440" height="160" rx="16" fill="#ffffff"/>
  <rect width="440" height="160" rx="16" fill="none" stroke="#e2e8f0" stroke-width="1"/>
  
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="40" x2="440" y2="40"/>
    <line x1="0" y1="80" x2="440" y2="80"/>
    <line x1="0" y1="120" x2="440" y2="120"/>
    <line x1="110" y1="0" x2="110" y2="160"/>
    <line x1="220" y1="0" x2="220" y2="160"/>
    <line x1="330" y1="0" x2="330" y2="160"/>
  </g>

  <!-- Logo Mark -->
  <g transform="translate(30, 35)">
    <!-- Tensor brackets -->
    <path d="M 5 5 L 5 85 L 18 85 L 18 79 L 11 79 L 11 11 L 18 11 L 18 5 Z" fill="url(#tensorGrad)"/>
    <path d="M 85 5 L 85 85 L 72 85 L 72 79 L 79 79 L 79 11 L 72 11 L 72 5 Z" fill="url(#tensorGrad)"/>
    
    <!-- Flow lines -->
    <line x1="22" y1="28" x2="68" y2="28" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="45" x2="68" y2="45" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="62" x2="68" y2="62" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Data nodes -->
    <circle cx="30" cy="28" r="4" fill="url(#dotGrad)"/>
    <circle cx="45" cy="45" r="4" fill="url(#dotGrad)"/>
    <circle cx="60" cy="62" r="4" fill="url(#dotGrad)"/>
    
    <!-- Convergence -->
    <path d="M 68 28 L 80 45 L 68 62" fill="none" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="45" r="5" fill="#0891b2"/>
    <circle cx="80" cy="45" r="9" fill="none" stroke="#0891b2" opacity="0.25" stroke-width="1.5"/>
  </g>

  <!-- Text -->
  <g transform="translate(135, 20)">
    <text x="0" y="75" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="58" font-weight="700" fill="#1e293b" letter-spacing="-2">
      Infer
    </text>
    <text x="158" y="75" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="58" font-weight="800" fill="url(#tensorGrad)" letter-spacing="-2">
      X
    </text>
  </g>

  <!-- Tagline -->
  <text x="137" y="110" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="4">
    AI INFERENCE ENGINE
  </text>

  <!-- Accent line -->
  <rect x="137" y="118" width="100" height="2" rx="1" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Bottom tagline -->
  <text x="137" y="140" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" letter-spacing="1">
    C++20 Tensor Engine + Visual Pipeline
  </text>
</svg>
